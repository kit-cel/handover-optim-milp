name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests

  with-simulator:
    if: ${{ vars.SIMULATOR_CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kit-cel/mobile-network-sim
          token: ${{ secrets.SIMULATOR_REPO_TOKEN }}
          path: simulator
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./simulator
      - run: python -m pip install -e '.[simulator,test]'
      - run: python -m pytest -q tests
